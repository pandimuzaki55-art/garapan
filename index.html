function day(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowText(){return new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}
function durationText(ms){let m=Math.max(1,Math.round(ms/60000));return m<60?m+' menit':Math.floor(m/60)+' jam '+(m%60)+' menit'}
function rollover(){let d=day();if(state.day!==d){let prev=state.day;let y=new Date();y.setDate(y.getDate()-1);let ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');state.streak=state.day===ys?state.streak+1:(state.today>0?1:state.streak);state.day=d;state.today=0;save()}}rollover()
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function activity(n=1){state.today+=n;state.days[day()]=(state.days[day()]||0)+n;save()}
function learnWord(w){if(!state.learned.includes(w))state.learned.push(w);activity();save()}
function favorite(w){state.favorites=state.favorites.includes(w)?state.favorites.filter(x=>x!==w):[...state.favorites,w];save()}

function sendReport(r){sendText(reportText(r))}
function sendTodayReports(){let d=day(),rs=state.reports.filter(x=>x.date===d);sendText(rs.length?rs.map(reportText).join('\n----------------\n'):'Belum ada laporan hari ini.')}

function flashPage(a){
if(!fc){a.innerHTML=`<div class="card"><h2>🃏 Flashcard Kosakata</h2><p>Kartu dipisahkan dari daftar kosakata. Klik kartu untuk membaliknya.</p><div class="row"><select id="fclevel">${LEVELS.map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select><input id="fcnum" type="number" min="5" max="30" value="10"></div><button class="primary" style="margin-top:10px" onclick="startFC()">▶ Mulai Flashcard</button></div>`;return}
let x=fc.deck[fc.index];a.innerHTML=`<div class="flashwrap"><div class="fcprogress">Kartu ${fc.index+1}/${fc.deck.length} · Dilihat ${fc.seen.size}</div><div class="flashcard card" onclick="fc.flipped=!fc.flipped;render()">${fc.flipped?`<div class="flashback"><div class="flashword">${esc(x[0])}</div><div style="color:#2563eb;font-weight:800">${esc(x[1])}</div><p>${esc(x[2])}</p><button onclick="event.stopPropagation();speak('${esc(x[0])}')">🔊 Dengarkan</button></div>`:`<div><div class="flashword">${esc(x[0])}</div><div class="flashhint">Klik kartu untuk melihat arti</div></div>`}</div><div class="fccontrols">${fc.flipped?`<button class="primary" onclick="nextFC(true)">✓ Saya ingat</button><button onclick="nextFC(false)">🔁 Perlu review</button>`:`<button onclick="fc.flipped=true;render()">Balik Kartu</button>`}<button onclick="finishFC()">Selesai</button></div></div>`}
function startFC(){let l=document.getElementById('fclevel').value,n=Math.min(30,Math.max(5,+document.getElementById('fcnum').value||10));let d=vocabData.filter(x=>x[3]===l).sort(()=>Math.random()-.5).slice(0,n);fc={deck:d,index:0,flipped:false,seen:new Set(),started:Date.now(),level:l};render()}
function nextFC(ok){fc.seen.add(fc.index);if(ok)learnWord(fc.deck[fc.index][0]);else markReview({id:'vocab|'+fc.deck[fc.index][0],kind:'vocab',front:fc.deck[fc.index][0],back:fc.deck[fc.index][1],extra:fc.deck[fc.index][2],level:fc.level});if(fc.index+1>=fc.deck.length){finishFC();return}fc.index++;fc.flipped=false;render()}
function finishFC(){if(!fc)return;let old=fc,r={kind:'flashcard',type:'Flashcard Kosakata',level:old.level,date:day(),when:nowText(),duration:durationText(Date.now()-old.started),cards:old.seen.size,total:old.deck.length};activity(Math.max(1,old.seen.size));addReport(r);fc=null;document.getElementById('app').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:65px">📋</div><h2>Laporan Belajar</h2><p><b>${r.type} • ${r.level}</b></p><div class="grid"><div><div class="stat">${r.cards}/${r.total}</div><p>Kartu dilihat</p></div><div><div class="stat">${r.duration}</div><p>Durasi</p></div></div><div class="report-actions"><button class="primary" onclick="sendReport(${JSON.stringify(r).replace(/"/g,'&quot;')})">📨 Kirim Laporan</button><button onclick="go('tracker')">📊 Riwayat</button><button onclick="go('flashvocab')">Kembali</button></div></div>`}
function grammarPage(a){let f=grammarData.filter(x=>x[0]===state.level);a.innerHTML=`<div class="card"><div class="row"><h2 style="margin-right:auto">📖 Tata Bahasa ${state.level}</h2><select onchange="state.level=this.value;save();render()">${LEVELS.map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid" style="margin-top:12px">${f.map(x=>`<div class="card"><span class="pill">${x[0]}</span><h3>${x[1]}</h3><div class="formula">${x[2]}</div><p>${x[3]}</p><p><b>Contoh:</b> ${x[4]}</p><p class="muted">🇮🇩 ${x[5]}</p><div class="fccontrols"><button onclick="speak('${esc(x[4])}')">🔊</button><button onclick="markReview({id:'grammar|${esc(x[1])}',kind:'grammar',front:'${esc(x[1])}',back:'${esc(x[3])}',extra:'${esc(x[2])}<br>${esc(x[4])}<br>${esc(x[5])}',level:'${x[0]}'})">🔁 Review</button></div></div>`).join('')||'<div class="card">Materi level ini belum tersedia di versi awal.</div>'}</div></div>`}
let vqz=null;
function vocabQuizPage(a){if(vqz)return renderVocabQuiz();a.innerHTML=`<section class="card"><h2>🎯 Tebak Kosakata</h2><p>Latihan khusus kosakata. Jawaban salah otomatis masuk ke Review.</p><div class="grid"><label>Level<select id="vqLevel">${LEVELS.map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select></label><label>Jumlah soal<select id="vqCount"><option>5</option><option selected>10</option><option>20</option></select></label></div><div class="grid" style="margin-top:12px"><button onclick="startVocabQuiz('meaning')">🇮🇩 → 🇬🇧 Tebak Kata</button><button onclick="startVocabQuiz('word')">🇬🇧 → 🇮🇩 Tebak Arti</button><button onclick="startVocabQuiz('listen')">🔊 Dengar & Tebak</button></div></section>`}
function startVocabQuiz(mode){let lv=document.getElementById('vqLevel').value,n=+document.getElementById('vqCount').value,p=vocabData.filter(x=>x[3]===lv).sort(()=>Math.random()-.5);if(p.length<4)p=vocabData.sort(()=>Math.random()-.5);vqz={mode,level:lv,items:p.slice(0,n),pos:0,score:0,wrong:0,started:Date.now(),locked:false};renderVocabQuiz()}
function renderVocabQuiz(){let a=document.getElementById('app'),x=vqz.items[vqz.pos],q=vqz.mode==='meaning'?`Apa bahasa Inggris dari <b>${x[1]}</b>?`:vqz.mode==='word'?`Apa arti <b>${x[0]}</b>?`:'Dengarkan kata berikut, lalu pilih kata Inggris yang benar.',ans=vqz.mode==='word'?x[1]:x[0],o=vocabData.filter(z=>z[0]!==x[0]).sort(()=>Math.random()-.5).slice(0,3).map(z=>vqz.mode==='word'?z[1]:z[0]);o=[ans,...o].sort(()=>Math.random()-.5);a.innerHTML=`<section class="card"><div class="row"><b>${vqz.mode==='meaning'?'🇮🇩 → 🇬🇧 Tebak Kata':vqz.mode==='word'?'🇬🇧 → 🇮🇩 Tebak Arti':'🔊 Dengar & Tebak'}</b><span>Soal ${vqz.pos+1}/${vqz.items.length}</span></div><div class="quizbox">${vqz.mode==='listen'?`<button class="big" onclick="speak(${JSON.stringify(x[0])})">🔊 Putar Lagi</button>`:''}<h2>${q}</h2><div class="answers">${o.map(z=>`<button onclick="answerVocabQuiz(this,${JSON.stringify(z)})">${z}</button>`).join('')}</div></div></section>`;if(vqz.mode==='listen')setTimeout(()=>speak(x[0]),100)}
function answerVocabQuiz(btn,ans){if(vqz.locked)return;vqz.locked=true;let x=vqz.items[vqz.pos],correct=vqz.mode==='word'?x[1]:x[0],ok=ans===correct;if(ok){vqz.score++;btn.classList.add('correct')}else{vqz.wrong++;btn.classList.add('wrong');document.querySelectorAll('.answers button').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});state.review=state.review||[];if(!state.review.some(r=>(r.id||r.word)==='vocab|'+x[0]))state.review.push({id:'vocab|'+x[0],word:x[0],meaning:x[1],example:x[2],level:x[3],date:day()});state.wrong=state.wrong||[];state.wrong.push({date:day(),question:x[0],correct:correct,your:ans,level:x[3],type:'Tebak Kosakata'})}state.total=(state.total||0)+1;if(ok)state.correct=(state.correct||0)+1;save();setTimeout(()=>{vqz.pos++;vqz.locked=false;if(vqz.pos>=vqz.items.length)finishVocabQuiz();else renderVocabQuiz()},600)}
function finishVocabQuiz(){let r={kind:'session',type:'Tebak Kosakata',level:vqz.level,date:day(),when:nowText(),duration:durationText(vqz.started),questions:vqz.items.length,correct:vqz.score,wrong:vqz.wrong,accuracy:Math.round(vqz.score/vqz.items.length*100)};state.sessions=(state.sessions||0)+1;addReport(r);vqz=null;save();document.getElementById('app').innerHTML=`<section class="card"><h2>📋 Laporan Belajar</h2><p><b>Tebak Kosakata — ${r.level}</b></p><div class="stats"><div><b>${r.questions}</b><small>Soal</small></div><div><b>${r.correct}</b><small>Benar</small></div><div><b>${r.wrong}</b><small>Salah</small></div><div><b>${r.accuracy}%</b><small>Akurasi</small></div></div><p>⏱ Durasi: <b>${r.duration}</b></p><p>${r.wrong?'⚠️ Jawaban salah otomatis masuk ke Review.':'🎉 Semua jawaban benar!'}</p><div class="grid"><button onclick="go('vocabquiz')">🔁 Coba Lagi</button><button onclick="go('review')">🔁 Review</button><button onclick="go('tracker')">📊 Perkembangan</button></div></section>`}

function quizPage(a){
if(!qz){a.innerHTML=`<div class="card"><h2>📝 Latihan</h2><p>Pilih jumlah soal. Hasil benar/salah dan akurasi akan masuk ke laporan belajar.</p><div class="row"><select id="qnum"><option>5</option><option selected>10</option><option>20</option></select><select id="qlevel">${LEVELS.map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select></div><button class="primary" style="margin-top:10px" onclick="startQuiz()">▶ Mulai Latihan</button></div>`;return}
let q=qz.items[qz.pos];a.innerHTML=`<div class="card"><div class="row"><span class="pill">${q[4]}</span><span class="pill">Soal ${qz.pos+1}/${qz.items.length}</span><b style="margin-left:auto">Skor ${qz.score}</b></div><div class="progress" style="margin:12px 0"><div class="bar" style="width:${Math.round(qz.pos/qz.items.length*100)}%"></div></div><h2>${esc(q[0])}</h2>${[q[1],q[2],q[3]].sort(()=>Math.random()-.5).map(x=>`<button class="option" onclick="answerQuiz(this,'${esc(x)}')">${esc(x)}</button>`).join('')}</div>`}
function startQuiz(){let n=+document.getElementById('qnum').value,l=document.getElementById('qlevel').value;let pool=quizData.filter(x=>x[4]===l);if(!pool.length)pool=quizData;qz={items:pool.sort(()=>Math.random()-.5).slice(0,n),pos:0,score:0,wrong:0,started:Date.now(),level:l};render()}
function answerQuiz(btn,a){if(qz.lock)return;qz.lock=true;let q=qz.items[qz.pos],correct=a===q[1];state.total++;if(correct){state.correct++;qz.score++;btn.classList.add('correct')}else{qz.wrong++;btn.classList.add('wrong');state.wrong.push({date:day(),question:q[0],correct:q[1],your:a,level:q[4]})}activity();save();setTimeout(()=>{qz.lock=false;qz.pos++;if(qz.pos>=qz.items.length)finishQuiz();else render()},350)}
function finishQuiz(){let z=qz,r={kind:'session',type:'Latihan Pilihan Ganda',level:z.level,date:day(),when:nowText(),duration:durationText(Date.now()-z.started),questions:z.items.length,correct:z.score,wrong:z.wrong,accuracy:Math.round(z.score/z.items.length*100)};state.sessions++;addReport(r);qz=null;document.getElementById('app').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:65px">📋</div><h2>Laporan Belajar</h2><p><b>${r.type} • ${r.level}</b></p><div class="grid"><div><div class="stat">${r.correct}</div><p>Benar</p></div><div><div class="stat">${r.wrong}</div><p>Salah</p></div><div><div class="stat">${r.accuracy}%</div><p>Akurasi</p></div></div><p>Durasi: <b>${r.duration}</b></p><div class="report-actions"><button class="primary" onclick="sendReport(${JSON.stringify(r).replace(/"/g,'&quot;')})">📨 Kirim Laporan</button><button onclick="go('review')">🔁 Review Salah/ Sulit</button><button onclick="go('tracker')">📊 Perkembangan</button></div></div>`}
function listeningPage(a){let texts=[['A1','Hello! My name is Alex. I live in Jakarta and I work in a small office.'],['A2','Yesterday I went to the market because I needed some food for dinner.'],['B1','Learning English is easier when you practice a little every day and use the language in real situations.'],['B2','Remote workers need clear communication because messages can sometimes be misunderstood without context.'],['C1','A useful learning strategy combines deliberate practice with regular exposure to authentic language.'],['C2','Complex ideas are easier to understand when the speaker organizes evidence and explains relationships clearly.']];let x=texts.find(y=>y[0]===state.level)||texts[0];a.innerHTML=`<div class="card"><span class="pill">${x[0]}</span><h2>🎧 Listening</h2><p class="reading">${x[1]}</p><div class="fccontrols"><button class="primary" onclick="speak('${esc(x[1])}')">▶ Putar Normal</button><button onclick="listenSlow()">🐢 Putar Lambat</button></div><hr><h3>Latihan dengar & ketik</h3><p class="muted">Dengarkan kalimat, lalu ketik yang kamu dengar.</p><button onclick="speak('${esc(x[1])}')">🔊 Putar</button><input id="listenInput" style="width:100%;margin-top:10px;padding:11px;border:1px solid #dbe3ef;border-radius:9px"><button class="primary" style="margin-top:8px" onclick="checkListen('${esc(x[1])}')">Periksa</button><div id="listenResult"></div></div>`}
function listenSlow(){let t=document.querySelector('.reading')?.textContent||'';speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.55;speechSynthesis.speak(u)}
function checkListen(correct){let a=document.getElementById('listenInput').value.trim().toLowerCase().replace(/[.,!?]/g,'');let b=correct.toLowerCase().replace(/[.,!?]/g,'');let ok=a===b;activity();document.getElementById('listenResult').innerHTML=`<div class="${ok?'ok':'warn'}" style="margin-top:10px">${ok?'✓ Benar!':'Belum tepat.'}<br><span class="muted">${ok?'':'Jawaban: '+esc(correct)}</span></div>`;save()}
function speakingPage(a){a.innerHTML=`<div class="card"><h2>🎙 Speaking</h2><p>Tekan mulai, ucapkan kalimat, lalu browser akan mencoba mengenali suara kamu.</p><div class="formula">“I am learning English every day.”</div><div class="fccontrols"><button class="primary" onclick="startSpeech()">🎙 Mulai bicara</button><button onclick="speak('I am learning English every day.')">🔊 Contoh</button></div><div id="speechOut" style="margin-top:15px"></div></div>`}
function startSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('speechOut').innerHTML='<div class="warn">Speech Recognition tidak tersedia di browser ini. Gunakan Chrome versi yang mendukungnya.</div>';return}let r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{let got=e.results[0][0].transcript, target='I am learning English every day.';let score=similarity(got.toLowerCase(),target.toLowerCase());activity();document.getElementById('speechOut').innerHTML=`<div class="ok"><b>Terdengar:</b> ${esc(got)}<br><b>Skor kemiripan:</b> ${score}%<br><span class="muted">Target: ${target}</span></div>`;save()};r.onerror=e=>document.getElementById('speechOut').innerHTML='<div class="warn">Microphone/speech recognition tidak dapat digunakan: '+esc(e.error)+'</div>';r.start()}
function similarity(a,b){let A=new Set(a.split(/\s+/)),B=new Set(b.split(/\s+/)),same=[...A].filter(x=>B.has(x)).length;return Math.round(same/Math.max(A.size,B.size)*100)}
function readingPage(a){let x=readingData.find(y=>y[0]===state.level)||readingData[0];let words=x[2].split(/(\s+)/).map(w=>w.trim()?`<span class="wordtap" onclick="speak('${esc(w.replace(/[.,!?]/g,''))}')">${esc(w)}</span>`:w).join('');a.innerHTML=`<div class="card"><span class="pill">${x[0]}</span><h2>📖 ${x[1]}</h2><p class="reading">${words}</p><div class="fccontrols"><button onclick="speak('${esc(x[2])}')">🔊 Dengarkan</button><button class="primary" onclick="alert('${esc(x[3])}')">🇮🇩 Tampilkan terjemahan</button></div></div>`}
function writingPage(a){a.innerHTML=`<div class="card"><h2>✍ Writing</h2><p>Tulis beberapa kalimat bahasa Inggris. Versi ini memberikan pemeriksaan dasar langsung di browser.</p><textarea id="writingInput" placeholder="Contoh: I am learning English because I want to work online.">${writingResult}</textarea><div class="fccontrols"><button class="primary" onclick="checkWriting()">✓ Periksa tulisan</button></div><div id="writingOut"></div></div>`}
function checkWriting(){let t=document.getElementById('writingInput').value.trim();let issues=[];if(!t)issues.push('Tulisan masih kosong.');if(t&&!/[.!?]$/.test(t))issues.push('Tambahkan tanda baca di akhir kalimat.');if(/\bi\b/.test(t))issues.push('Gunakan “I” dengan huruf kapital.');if(/\s{2,}/.test(t))issues.push('Ada spasi ganda.');let words=t?t.split(/\s+/).length:0;activity();document.getElementById('writingOut').innerHTML=`<div class="${issues.length?'warn':'ok'}" style="margin-top:12px"><b>${issues.length?'Perlu diperbaiki':'Bagus!'}</b><p>Jumlah kata: ${words}</p>${issues.map(x=>'<div>• '+esc(x)+'</div>').join('')||'Tidak ada kesalahan dasar yang ditemukan.'}</div>`;save()}
function pronunciationPage(a){a.innerHTML=`<div class="card"><h2>🗣 Pronunciation</h2><p>Latih pengucapan dengan mendengarkan contoh dan mencoba mengucapkannya.</p><div class="formula">comfortable</div><p><b>IPA:</b> /ˈkʌm.fə.tə.bəl/</p><div class="fccontrols"><button class="primary" onclick="speak('comfortable')">🔊 Dengarkan</button><button onclick="startSpeechWord()">🎙 Coba Ucapkan</button></div><div id="pronOut"></div></div>`}
function startSpeechWord(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('pronOut').innerHTML='<div class="warn">Speech Recognition tidak tersedia.</div>';return}let r=new SR();r.lang='en-US';r.onresult=e=>{let got=e.results[0][0].transcript.toLowerCase(),score=similarity(got,'comfortable');document.getElementById('pronOut').innerHTML=`<div class="ok">Terdengar: <b>${esc(got)}</b><br>Skor kecocokan: <b>${score}%</b></div>`};r.start()}
function reviewPage(a){a.innerHTML=`<div class="card"><h2>🔁 Review</h2><p>Hanya item yang kamu tandai untuk review yang masuk di sini.</p>${state.review.length?state.review.map(x=>`<div class="day"><div class="row"><b>${esc(x.front)}</b><span class="pill">${esc(x.level)}</span><button style="margin-left:auto" onclick="removeReview('${esc(x.id)}')">Hapus</button></div><p>${esc(x.back)}</p><p class="muted">${x.extra||''}</p></div>`).join(''):'<p class="muted">Belum ada item yang ditandai.</p>'}</div>`}
function removeReview(id){state.review=state.review.filter(x=>x.id!==id);save();render()}
function sessionPage(a){if(!qz){a.innerHTML=`<div class="card"><h2>🎯 Sesi Gabungan</h2><p>Mode seperti sesi belajar aplikasi Jepang: kosakata → grammar → latihan. Setelah selesai, laporan sesi dibuat otomatis.</p><div class="row"><select id="sn"><option>5</option><option selected>10</option><option>15</option></select><select id="sl">${LEVELS.map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select></div><button class="primary" style="margin-top:10px" onclick="startSession()">▶ Mulai Sesi</button></div>`;return}quizPage(a)}
function startSession(){let n=+document.getElementById('sn').value,l=document.getElementById('sl').value;let pool=quizData.filter(x=>x[4]===l);if(!pool.length)pool=quizData;qz={items:[...pool].sort(()=>Math.random()-.5).slice(0,n),pos:0,score:0,wrong:0,started:Date.now(),level:l};render()}
function trackerPage(a){let acc=state.total?Math.round(state.correct/state.total*100):0;a.innerHTML=`<div class="grid"><div class="card"><h3>🔥 Konsistensi</h3><div class="stat">${state.streak} hari</div></div><div class="card"><h3>🎯 Target</h3><div class="stat">${state.today}/${state.goal}</div></div><div class="card"><h3>📈 Akurasi</h3><div class="stat">${acc}%</div></div><div class="card"><h3>📝 Sesi</h3><div class="stat">${state.sessions}</div></div></div>
<div class="card" style="margin-top:12px"><h2>⚙️ Target harian</h2><input type="number" min="1" max="100" value="${state.goal}" onchange="state.goal=Math.max(1,+this.value);save();render()"> aktivitas/soal per hari</div>
<div class="card" style="margin-top:12px"><h2>📅 Riwayat harian</h2>${Object.entries(state.days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,20).map(x=>`<div class="day"><b>${x[0]}</b> — ${x[1]} aktivitas</div>`).join('')||'<p class="muted">Belum ada riwayat.</p>'}</div>
<div class="card" style="margin-top:12px"><h2>📋 Laporan Belajar</h2><div class="report-actions"><button class="primary" onclick="sendTodayReports()">📨 Kirim Semua Hari Ini</button><button onclick="sendAllReports()">📨 Kirim Semua Laporan</button></div>${state.reports.map(r=>`<div class="day"><b>${esc(r.when)}</b><br>📚 ${esc(r.type)} · ${r.level||state.level} · Durasi ${esc(r.duration)}<br>${r.kind==='session'?`${r.correct}/${r.questions} benar (${r.accuracy}%)`:`${r.cards}/${r.total} kartu`}<br><button style="margin-top:6px" onclick='sendReport(${JSON.stringify(r).replace(/'/g,'&#39;')})'>📨 Salin Laporan Ini</button></div>`).join('')||'<p class="muted">Belum ada laporan.</p>'}</div>
<div class="card" style="margin-top:12px"><h2>💾 Data</h2><button onclick="exportData()">Export data</button> <button onclick="resetData()">Reset semua data</button></div>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='english-master-data.json';a.click()}
function resetData(){if(confirm('Hapus semua data belajar English Master?')){localStorage.removeItem(key);location.reload()}}
render();
</script>
</body></html>
